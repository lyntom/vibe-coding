<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Tamu Disperkim Samarinda | Buku Tamu Digital</title>
    <!-- Polyfill aman untuk kompatibilitas ekstensi peramban & isolasi Storage -->
    <script>
      (function () {
        try {
          if (typeof window !== 'undefined' && window.Storage) {
            var origSetItem = Storage.prototype.setItem;
            Storage.prototype.setItem = function (key, value) {
              try {
                origSetItem.call(this, key, value);
              } catch (e) {
                console.warn('Storage setItem:', e);
              }
              return Promise.resolve();
            };

            var origRemoveItem = Storage.prototype.removeItem;
            Storage.prototype.removeItem = function (key) {
              try {
                origRemoveItem.call(this, key);
              } catch (e) {
                console.warn('Storage removeItem:', e);
              }
              return Promise.resolve();
            };

            var origClear = Storage.prototype.clear;
            Storage.prototype.clear = function () {
              try {
                origClear.call(this);
              } catch (e) {
                console.warn('Storage clear:', e);
              }
              return Promise.resolve();
            };
          }
        } catch (err) {
          console.warn('Storage patch init:', err);
        }
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Public+Sans:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
