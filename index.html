    <!-- GitHub Pages SPA routing & hash-to-clean URL converter -->
    <script>
      (function (l) {
        if (l.hash && l.hash.startsWith('#/')) {
          var cleanPath = l.hash.substring(1);
          window.history.replaceState(null, null, l.pathname.replace(/\/$/, '') + cleanPath);
        } else if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Polyfill aman untuk kompatibilitas ekstensi peramban & isolasi Storage -->
    <script>
      (function () {
        try {
          if (typeof window !== 'undefined' && window.Storage) {
            var origSetItem = Storage.prototype.setItem;
            Storage.prototype.setItem = function (key, value) {
              try {
                origSetItem.call(this, key, value);
              } catch (e) {
                console.warn('Storage setItem:', e);
              }
              return Promise.resolve();
            };

            var origRemoveItem = Storage.prototype.removeItem;
            Storage.prototype.removeItem = function (key) {
              try {
                origRemoveItem.call(this, key);
              } catch (e) {
                console.warn('Storage removeItem:', e);
              }
              return Promise.resolve();
            };

            var origClear = Storage.prototype.clear;
            Storage.prototype.clear = function () {
              try {
                origClear.call(this);
              } catch (e) {
                console.warn('Storage clear:', e);
              }
              return Promise.resolve();
            };
          }
        } catch (err) {
          console.warn('Storage patch init:', err);
        }
      })();
    </script>
